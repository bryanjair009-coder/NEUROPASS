<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" fill="none">
  <!--
    Gráfico destacado de Google Play (1024 × 500).

    Se guarda en vectorial para poder reexportarlo cuando cambie el nombre o el
    lema sin volver a dibujar nada. Para convertirlo a PNG, que es lo que pide
    Play Console:

      npx -y sharp-cli -i assets/tienda/grafico-destacado.svg -o assets/tienda/grafico-destacado.png resize 1024 500

    La imagen de AXO se compone aparte: Play no admite SVG y el recorte del
    personaje es un PNG. Al exportar, se pega encima de la zona derecha.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5FFF" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="pildora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B84FF" />
      <stop offset="1" stop-color="#7C5FFF" />
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#fondo)" />

  <!-- Formas de fondo, el mismo lenguaje que la app. -->
  <circle cx="880" cy="90" r="150" fill="#FFFFFF" opacity="0.10" />
  <circle cx="120" cy="430" r="120" fill="#FFFFFF" opacity="0.08" />
  <rect x="760" y="330" width="180" height="180" rx="52" fill="#FFFFFF" opacity="0.07" transform="rotate(18 850 420)" />

  <text x="72" y="196" font-family="Baloo 2, Trebuchet MS, sans-serif" font-size="74" font-weight="800" fill="#FFFFFF">
    NEUROpass
  </text>
  <text x="76" y="256" font-family="Nunito, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" opacity="0.94">
    El tiempo de pantalla se gana
  </text>
  <text x="76" y="298" font-family="Nunito, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" opacity="0.94">
    resolviendo retos
  </text>

  <!-- Píldora con canto, como el botón principal de la app. -->
  <rect x="72" y="340" width="330" height="72" rx="36" fill="#5B3FE0" />
  <rect x="72" y="336" width="330" height="66" rx="33" fill="url(#pildora)" />
  <text x="237" y="378" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">
    Control parental con AXO
  </text>

  <!-- Marco donde se pega el recorte de AXO al exportar. -->
  <ellipse cx="760" cy="430" rx="130" ry="22" fill="#0A1330" opacity="0.28" />
</svg>
